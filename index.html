<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cesium AR Overlay</title>
</head>
<body>

<video id="cameraVideo" autoplay playsinline muted></video>
<div id="cesiumContainer"></div>

<div id="ui">
    <div class="top-bar">
        <div class="live-badge" id="liveBadge"><span class="dot"></span>AR</div>
    </div>

    <div class="left-panel" id="leftPanel">
        <div class="panel">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                <h3 style="margin:0;">상태 / 보정</h3>
                <button class="btn secondary small" id="panelToggleBtn" type="button">닫기</button>
            </div>

            <div id="leftPanelBody" style="margin-top:10px;">
                <div class="status" id="status">초기화 대기중...</div>

                <div class="row">
                    <div class="label"><span>Heading Offset</span><span id="headingVal">0</span></div>
                    <input id="headingOffset" type="range" min="-180" max="180" step="1" value="0" />
                </div>

                <div class="row">
                    <div class="label"><span>Pitch Offset</span><span id="pitchVal">0</span></div>
                    <input id="pitchOffset" type="range" min="-90" max="90" step="1" value="0" />
                </div>

                <div class="row">
                    <div class="label"><span>Height Offset (m)</span><span id="heightVal">0</span></div>
                    <input id="heightOffset" type="range" min="-100" max="100" step="1" value="0" />
                </div>

                <div class="row">
                    <div class="label"><span>Tileset Height (m)</span><span id="tilesetHeightVal">0</span></div>
                    <input id="tilesetHeightOffset" type="range" min="-150" max="150" step="1" value="0" />
                </div>

                <div class="row">
                    <div class="label"><span>FOV</span><span id="fovVal">60</span></div>
                    <input id="fovRange" type="range" min="35" max="100" step="1" value="60" />
                </div>

                <div class="small" id="coordText">현재 좌표: 아직 없음</div>
                <div class="small" id="sensorText">센서값: 아직 없음</div>
                <div class="small" id="tilesetText">타일셋: 아직 없음</div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="chip" id="gpsChip" style="cursor:pointer;">
            <div class="chip-row"><span class="chip-label">위도</span><span id="latEl">—</span></div>
            <div class="chip-row"><span class="chip-label">경도</span><span id="lonEl">—</span></div>
            <div class="chip-row"><span class="chip-label">정확도</span><span id="accEl">—</span></div>
        </div>

        <button class="ar-toggle off" id="arToggleBtn">AR 시작</button>

        <div class="compass-wrap">
            <div class="compass">
                <span class="compass-n">N</span>
                <div class="needle" id="compassNeedle"></div>
            </div>
            <span class="deg" id="headEl">—°</span>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div id="debugTab">
    <button onclick="toggleDebug()">DEBUG</button>
</div>

<div class="debug-panel" id="debugPanel">
    <div class="debug-head">
        <span class="debug-head-title">AR 디버그</span>
        <button onclick="toggleDebug()">닫기</button>
    </div>
    <div id="debugLog"></div>
    <div class="debug-actions">
        <button onclick="debugTestCamera()">카메라</button>
        <button onclick="debugTestGPS()">GPS</button>
        <button onclick="debugTestOrientation()">센서</button>
        <button onclick="document.getElementById('debugLog').innerHTML=''">지우기</button>
    </div>
</div>

    function normalizeDegrees(deg) {
        let d = deg % 360;
        if (d < 0) d += 360;
        return d;
    }

    function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));

    function showToast(msg, ms = 2500) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");

    function updateOffsetLabels() {

    function updateGPSChip() {
        latEl.textContent = currentLat == null ? "—" : currentLat.toFixed(6);
        lonEl.textContent = currentLon == null ? "—" : currentLon.toFixed(6);

        if (currentAccuracy == null) {
            accEl.textContent = "—";
            accEl.className = "";
            return;
        }

        const acc = Math.round(currentAccuracy);
        accEl.textContent = acc + "m";
        accEl.className = acc < 6 ? "acc-good" : acc < 20 ? "acc-ok" : "acc-bad";
    }

    function updateCoordText() {
        if (currentLon == null || currentLat == null) {
            coordTextEl.textContent = "현재 좌표: 아직 없음";
            return;
        }

        coordTextEl.textContent =
            `현재 좌표: lon=${currentLon.toFixed(6)}, lat=${currentLat.toFixed(6)}, gpsH=${currentHeight == null ? "n/a" : currentHeight.toFixed(1)}, ground=${groundHeight.toFixed(1)}, acc=${currentAccuracy == null ? "n/a" : Math.round(currentAccuracy) + "m"}`;
    }

    function updateSensorText() {
        sensorTextEl.textContent =
            `센서값: alpha=${lastAlpha.toFixed(1)}, beta=${lastBeta.toFixed(1)}, gamma=${lastGamma.toFixed(1)} / heading=${latestHeadingDeg.toFixed(1)}, pitch=${latestPitchDeg.toFixed(1)}, roll=${latestRollDeg.toFixed(1)}`;
        headEl.textContent = `${Math.round(latestHeadingDeg)}°`;
        compassNeedleEl.style.transform = `rotate(${-latestHeadingDeg}deg)`;
    }

    function updateTilesetText() {
        const loadedCount = (mainTileset ? 1 : 0) + extraTilesets.length;

        if (!mainTileset && extraTilesets.length === 0) {
            tilesetTextEl.textContent = "타일셋: 아직 없음";
            return;
        }

        let text = `타일셋: 총 ${loadedCount}개 로드됨`;
        if (mainTileset) {
            const center = Cesium.Cartographic.fromCartesian(mainTileset.boundingSphere.center);
            text += ` / mainLon=${Cesium.Math.toDegrees(center.longitude).toFixed(6)}, mainLat=${Cesium.Math.toDegrees(center.latitude).toFixed(6)}`;
        }
        text += ` / offsetH=${Number(tilesetHeightOffsetEl.value).toFixed(1)}`;

        tilesetTextEl.textContent = text;
    }

    function getScreenOrientationAngleDeg() {
        if (screen.orientation && typeof screen.orientation.angle === "number") {
            return screen.orientation.angle;
        }
        if (typeof window.orientation === "number") {
            return window.orientation;
        }
        return 0;
    }

    function multiplyMatrix3Array(a, b) {
        return [
            a[0]*b[0] + a[1]*b[3] + a[2]*b[6],
            a[0]*b[1] + a[1]*b[4] + a[2]*b[7],
            a[0]*b[2] + a[1]*b[5] + a[2]*b[8],

            a[3]*b[0] + a[4]*b[3] + a[5]*b[6],
            a[3]*b[1] + a[4]*b[4] + a[5]*b[7],
            a[3]*b[2] + a[4]*b[5] + a[5]*b[8],

            a[6]*b[0] + a[7]*b[3] + a[8]*b[6],
            a[6]*b[1] + a[7]*b[4] + a[8]*b[7],
            a[6]*b[2] + a[7]*b[5] + a[8]*b[8]
        ];
    }

    function multiplyMatrixVector3(m, v) {
        return new Cesium.Cartesian3(
            m[0] * v.x + m[1] * v.y + m[2] * v.z,
            m[3] * v.x + m[4] * v.y + m[5] * v.z,
            m[6] * v.x + m[7] * v.y + m[8] * v.z
        );
    }

    function rotationZ(rad) {
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        return [
            c, -s, 0,
            s,  c, 0,
            0,  0, 1
        ];
    }

    function rotationX(rad) {
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        return [
            1, 0,  0,
            0, c, -s,
            0, s,  c
        ];
    }

    function rotationY(rad) {
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        return [
            c, 0, s,
            0, 1, 0,
            -s, 0, c
        ];
    }

    function normalizeVec(v) {
        const out = Cesium.Cartesian3.clone(v);
        return Cesium.Cartesian3.normalize(out, out);
    }

    function projectToPlane(v, normal) {
        const dot = Cesium.Cartesian3.dot(v, normal);
        const scaledNormal = Cesium.Cartesian3.multiplyByScalar(normal, dot, new Cesium.Cartesian3());
        return Cesium.Cartesian3.subtract(v, scaledNormal, new Cesium.Cartesian3());
    }

    function rotateAroundAxis(vec, axis, angleRad) {
        const k = normalizeVec(axis);
        const cosA = Math.cos(angleRad);
        const sinA = Math.sin(angleRad);

        const term1 = Cesium.Cartesian3.multiplyByScalar(vec, cosA, new Cesium.Cartesian3());
        const kCrossV = Cesium.Cartesian3.cross(k, vec, new Cesium.Cartesian3());
        const term2 = Cesium.Cartesian3.multiplyByScalar(kCrossV, sinA, new Cesium.Cartesian3());
        const kDotV = Cesium.Cartesian3.dot(k, vec);
        const term3 = Cesium.Cartesian3.multiplyByScalar(k, kDotV * (1 - cosA), new Cesium.Cartesian3());

        const temp = Cesium.Cartesian3.add(term1, term2, new Cesium.Cartesian3());
        return Cesium.Cartesian3.add(temp, term3, temp);
    }

    function buildDirectionUpFromHeadingPitchRoll(headingDeg, pitchDeg, rollDeg) {
        const headingRad = Cesium.Math.toRadians(headingDeg);
        const pitchRad = Cesium.Math.toRadians(pitchDeg);
        const rollRad = Cesium.Math.toRadians(rollDeg);

        const dir = new Cesium.Cartesian3(
            Math.cos(pitchRad) * Math.sin(headingRad),
            Math.cos(pitchRad) * Math.cos(headingRad),
            Math.sin(pitchRad)
        );
        Cesium.Cartesian3.normalize(dir, dir);

        const worldUp = new Cesium.Cartesian3(0, 0, 1);

        let right = Cesium.Cartesian3.cross(dir, worldUp, new Cesium.Cartesian3());
        if (Cesium.Cartesian3.magnitudeSquared(right) < 1e-8) {
            right = Cesium.Cartesian3.cross(dir, new Cesium.Cartesian3(0, 1, 0), right);
        }
        Cesium.Cartesian3.normalize(right, right);

        let up = Cesium.Cartesian3.cross(right, dir, new Cesium.Cartesian3());
        Cesium.Cartesian3.normalize(up, up);

        if (Math.abs(rollDeg) > 0.0001) {
            up = rotateAroundAxis(up, dir, rollRad);
            Cesium.Cartesian3.normalize(up, up);
        }

        return { direction: dir, up };
    }

    function computePoseFromDeviceOrientation(event) {
        const alpha = Cesium.Math.toRadians(event.alpha ?? 0);
        const beta = Cesium.Math.toRadians(event.beta ?? 0);
        const gamma = Cesium.Math.toRadians(event.gamma ?? 0);
        const orient = Cesium.Math.toRadians(getScreenOrientationAngleDeg());

        const rz = rotationZ(alpha);
        const rx = rotationX(beta);
        const ry = rotationY(gamma);
        const rs = rotationZ(-orient);

        let m = multiplyMatrix3Array(rz, rx);
        m = multiplyMatrix3Array(m, ry);
        m = multiplyMatrix3Array(m, rs);

        const deviceForward = new Cesium.Cartesian3(0, 0, -1);
        const deviceUp = new Cesium.Cartesian3(0, 1, 0);

        let forward = multiplyMatrixVector3(m, deviceForward);
        let up = multiplyMatrixVector3(m, deviceUp);

        forward = normalizeVec(forward);
        up = normalizeVec(up);

        let headingDeg;
        if (typeof event.webkitCompassHeading === "number" && Number.isFinite(event.webkitCompassHeading)) {
            headingDeg = normalizeDegrees(event.webkitCompassHeading);
        } else {
            headingDeg = normalizeDegrees(Cesium.Math.toDegrees(Math.atan2(forward.x, forward.y)));
        }

        const pitchDeg = Cesium.Math.toDegrees(Math.asin(clamp(forward.z, -1, 1)));

        const worldUp = new Cesium.Cartesian3(0, 0, 1);

        let baseRight = Cesium.Cartesian3.cross(forward, worldUp, new Cesium.Cartesian3());
        if (Cesium.Cartesian3.magnitudeSquared(baseRight) < 1e-8) {
            baseRight = Cesium.Cartesian3.cross(forward, new Cesium.Cartesian3(0, 1, 0), baseRight);
        }
        Cesium.Cartesian3.normalize(baseRight, baseRight);

        let baseUp = Cesium.Cartesian3.cross(baseRight, forward, new Cesium.Cartesian3());
        Cesium.Cartesian3.normalize(baseUp, baseUp);

        let upProjected = projectToPlane(up, forward);
        if (Cesium.Cartesian3.magnitudeSquared(upProjected) < 1e-8) {
            upProjected = Cesium.Cartesian3.clone(baseUp);
        }
        Cesium.Cartesian3.normalize(upProjected, upProjected);

        const crossUp = Cesium.Cartesian3.cross(baseUp, upProjected, new Cesium.Cartesian3());
        const sinRoll = Cesium.Cartesian3.dot(crossUp, forward);
        const cosRoll = Cesium.Cartesian3.dot(baseUp, upProjected);

        const rollDeg = Cesium.Math.toDegrees(Math.atan2(sinRoll, cosRoll));

        return { headingDeg, pitchDeg, rollDeg };
    }

    function getCameraAltitude() {
        const manualOffset = Number(heightOffsetEl.value) || 0;
        const gpsAltitudeValid = Number.isFinite(currentHeight) && currentHeight > -100 && currentHeight < 10000;
        const terrainValid = Number.isFinite(groundHeight);

        if (gpsAltitudeValid) {
            return currentHeight + eyeHeightMeters + manualOffset;
        }
        if (terrainValid) {
            return groundHeight + eyeHeightMeters + manualOffset;
        }
        return eyeHeightMeters + manualOffset;
    }

    function applyCameraPose() {
        if (currentLon == null || currentLat == null) return;

        const headingOffset = Number(headingOffsetEl.value) || 0;
        const pitchOffset = Number(pitchOffsetEl.value) || 0;

        latestHeadingDeg = normalizeDegrees(rawHeadingDeg - calibratedHeading + headingOffset);

        const pitchBase = rawPitchDeg - calibratedPitch;
        const rollBase = rawRollDeg - calibratedRoll;

        const rollInfluence = Math.min(Math.abs(rollBase) / 45, 1);
        const pitchWeight = 1 - rollInfluence * 0.85;

        latestPitchDeg = clamp(pitchBase * pitchWeight + pitchOffset, -89, 89);
        latestRollDeg = clamp(rollBase * 0.35, -30, 30);

        const position = Cesium.Cartesian3.fromDegrees(
            currentLon,
            currentLat,
            getCameraAltitude()
        );

        const localPose = buildDirectionUpFromHeadingPitchRoll(
            latestHeadingDeg,
            latestPitchDeg,
            latestRollDeg
        );

        const enuFrame = Cesium.Transforms.eastNorthUpToFixedFrame(position);

        const worldDirection = Cesium.Matrix4.multiplyByPointAsVector(
            enuFrame,
            localPose.direction,
            new Cesium.Cartesian3()
        );
        Cesium.Cartesian3.normalize(worldDirection, worldDirection);

        const worldUp = Cesium.Matrix4.multiplyByPointAsVector(
            enuFrame,
            localPose.up,
            new Cesium.Cartesian3()
        );
        Cesium.Cartesian3.normalize(worldUp, worldUp);

        viewer.camera.setView({
            destination: position,
            orientation: {
                direction: worldDirection,
                up: worldUp
            }
        });

        updateSensorText();
    }

    function moveCameraToCurrentPositionOnly() {
        if (currentLon == null || currentLat == null) return;

        const destination = Cesium.Cartesian3.fromDegrees(
            currentLon,
            currentLat,
            getCameraAltitude()
        );

        viewer.camera.setView({
            destination,
            orientation: {
                heading: 0,
                pitch: 0,
                roll: 0
            }
        });
    }

    function distanceMeters(lon1, lat1, lon2, lat2) {
        const c1 = Cesium.Cartographic.fromDegrees(lon1, lat1);
        const c2 = Cesium.Cartographic.fromDegrees(lon2, lat2);
        const g = new Cesium.EllipsoidGeodesic(c1, c2);
        return g.surfaceDistance;
    }

    async function updateGroundHeight(force = false) {
        if (currentLon == null || currentLat == null) return;

        const now = Date.now();
        if (!force && lastTerrainSampleLon != null && lastTerrainSampleLat != null) {
            const moved = distanceMeters(lastTerrainSampleLon, lastTerrainSampleLat, currentLon, currentLat);
            const elapsed = now - lastTerrainSampleTime;
            if (moved < 5 && elapsed < 3000) return;
        }

        try {
            const cartographic = Cesium.Cartographic.fromDegrees(currentLon, currentLat);
            const updated = await Cesium.sampleTerrainMostDetailed(
                viewer.terrainProvider,
                [cartographic]
            );

            if (updated && updated.length > 0 && Number.isFinite(updated[0].height)) {
                groundHeight = updated[0].height;
                lastTerrainSampleLon = currentLon;
                lastTerrainSampleLat = currentLat;
                lastTerrainSampleTime = now;
            }
        } catch (e) {
            console.warn("지면 높이 조회 실패:", e);
        }
    }

    async function loadSingleTileset(url, label) {
        const tileset = await Cesium.Cesium3DTileset.fromUrl(url, {
            maximumScreenSpaceError: 24,
            skipLevelOfDetail: true,
            preferLeaves: true,
            dynamicScreenSpaceError: true,
            preloadWhenHidden: false,
            cullWithChildrenBounds: true
        });

        viewer.scene.primitives.add(tileset);
        console.log("타일셋 로드 완료:", label, url);
        return tileset;
    }

    async function loadAllTilesets() {
        try {
            const alreadyLoaded = mainTileset || extraTilesets.length > 0;
            if (alreadyLoaded) return;

            statusEl.textContent = "타일셋 로드중...";

            // 1) 기존 메인 타일셋
            mainTileset = await loadSingleTileset(TILESET_URL, "main");

            // 2) 추가 나무 타일셋들
            for (let i = 0; i < EXTRA_TILESET_URLS.length; i++) {
                const url = EXTRA_TILESET_URLS[i];
                const tileset = await loadSingleTileset(url, `extra-${i + 1}`);
                extraTilesets.push(tileset);
            }

            applyTilesetHeightOffset();
            updateTilesetText();
            statusEl.textContent = `타일셋 로드 완료 (총 ${1 + extraTilesets.length}개)`;
        } catch (e) {
            console.error(e);
            statusEl.textContent = `타일셋 로드 실패: ${e.message}`;
            showToast("타일셋 로드 실패: " + e.message, 3500);
        }
    }

    function applyHeightOffsetToTileset(tileset, offsetMeters) {
        if (!tileset || !tileset.boundingSphere) return;

        const cartographic = Cesium.Cartographic.fromCartesian(tileset.boundingSphere.center);

        const surface = Cesium.Cartesian3.fromRadians(
            cartographic.longitude,
            cartographic.latitude,
            cartographic.height
        );

        const offset = Cesium.Cartesian3.fromRadians(
            cartographic.longitude,
            cartographic.latitude,
            cartographic.height + offsetMeters
        );

        const translation = Cesium.Cartesian3.subtract(offset, surface, new Cesium.Cartesian3());
        tileset.modelMatrix = Cesium.Matrix4.fromTranslation(translation);
    }

    function applyTilesetHeightOffset() {
        const offsetMeters = Number(tilesetHeightOffsetEl.value || 0);

        if (mainTileset) {
            applyHeightOffsetToTileset(mainTileset, offsetMeters);
        }

        for (const tileset of extraTilesets) {
            applyHeightOffsetToTileset(tileset, offsetMeters);
        }

        updateTilesetText();
    }

    async function startCamera() {
        if (cameraStarted) return;

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        videoEl.srcObject = cameraStream;
        await videoEl.play();
        videoEl.style.display = "block";
        cameraStarted = true;
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        videoEl.srcObject = null;
        videoEl.style.display = "none";
        cameraStarted = false;
    }

    function waitForFirstGpsFix(timeoutMs = 15000) {
        return new Promise((resolve, reject) => {
            const startTime = Date.now();

            const timer = setInterval(() => {
                if (hasFirstGpsFix && currentLon != null && currentLat != null) {
                    clearInterval(timer);
                    resolve();
                    return;
                }

                if (Date.now() - startTime > timeoutMs) {
                    clearInterval(timer);
                    reject(new Error("현재 위치를 가져오지 못했습니다. 실외에서 위치 권한을 확인해보세요."));
                }
            }, 300);
        });
    }

    function startGeolocation() {
        if (gpsStarted) return;
        if (!navigator.geolocation) {
            throw new Error("이 브라우저는 geolocation을 지원하지 않습니다.");
        }

        watchId = navigator.geolocation.watchPosition(
            async (pos) => {
                currentLon = pos.coords.longitude;
                currentLat = pos.coords.latitude;
                currentHeight = Number.isFinite(pos.coords.altitude) ? pos.coords.altitude : null;
                currentAccuracy = Number.isFinite(pos.coords.accuracy) ? pos.coords.accuracy : null;
                hasFirstGpsFix = true;

                await updateGroundHeight(false);
                updateCoordText();
                updateGPSChip();

                if (!orientationStarted) {
                    moveCameraToCurrentPositionOnly();
                } else if (arMode) {
                    applyCameraPose();
                }

                statusEl.textContent =
                    `GPS 수신중: ${currentLat.toFixed(6)}, ${currentLon.toFixed(6)}, h=${currentHeight == null ? "n/a" : currentHeight.toFixed(1)}`;
            },
            (err) => {
                console.error(err);
                statusEl.textContent = `GPS 실패: ${err.message}`;
                showToast("GPS 오류: " + err.message);
            },
            {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 10000
            }
        );

        gpsStarted = true;
    }

    function stopGeolocation() {
        if (watchId != null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        gpsStarted = false;
    }

    function handleDeviceOrientation(event) {
        lastAlpha = event.alpha ?? 0;
        lastBeta = event.beta ?? 0;
        lastGamma = event.gamma ?? 0;

        const pose = computePoseFromDeviceOrientation(event);
        rawHeadingDeg = pose.headingDeg;
        rawPitchDeg = pose.pitchDeg;
        rawRollDeg = pose.rollDeg;

        if (currentLon == null || currentLat == null) {
            latestHeadingDeg = rawHeadingDeg;
            latestPitchDeg = rawPitchDeg;
            latestRollDeg = rawRollDeg;
            updateSensorText();
            return;
        }

        if (arMode) {
            applyCameraPose();
        } else {
            latestHeadingDeg = rawHeadingDeg;
            latestPitchDeg = rawPitchDeg;
            latestRollDeg = rawRollDeg;
            updateSensorText();
        }
    }

    async function requestiOSMotionPermissionIfNeeded() {
        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
            const result = await DeviceOrientationEvent.requestPermission();
            if (result !== "granted") {
                throw new Error("iOS 센서 권한이 거부되었습니다.");
            }
        }
    }

    function startOrientationTracking() {
        if (orientationStarted) return;
        window.addEventListener("deviceorientation", handleDeviceOrientation, true);
        orientationStarted = true;
    }

    function stopOrientationTracking() {
        if (!orientationStarted) return;
        window.removeEventListener("deviceorientation", handleDeviceOrientation, true);
        orientationStarted = false;
    }

    async function startAR() {
        try {
            statusEl.textContent = "권한 요청중...";

            await requestiOSMotionPermissionIfNeeded();
            startOrientationTracking();

            statusEl.textContent = "현재 위치 가져오는 중...";
            startGeolocation();
            await waitForFirstGpsFix();

            await updateGroundHeight(true);
            await loadAllTilesets();

            updateCoordText();
            updateGPSChip();
            applyCameraPose();

            await startCamera();

            viewer.scene.requestRender();
            await new Promise(resolve => requestAnimationFrame(resolve));
            await new Promise(resolve => setTimeout(resolve, 100));

            await loadWindLayer();

            arMode = true;
            arToggleBtn.className = "ar-toggle on";
            arToggleBtn.textContent = "AR 종료";
            liveBadgeEl.classList.add("show");

            statusEl.textContent = "AR 시작됨";
            showToast("AR 모드 활성화");
        } catch (e) {
            console.error(e);
            statusEl.textContent = `초기화 실패: ${e.message}`;
            showToast("초기화 실패: " + e.message, 3200);
        }
    }

    let windObject = null;
    async function loadWindLayer() {
        const ctx = viewer.scene.context;
        const gl = ctx?._gl;

        const maxTextureSize =
            Cesium.ContextLimits?.maximumTextureSize ??
            gl?.getParameter?.(gl.MAX_TEXTURE_SIZE);

        console.log("maxTextureSize:", maxTextureSize);
        console.log("webgl2:", ctx?._webgl2 ?? ctx?.webgl2);
        console.log("contextLost:", gl?.isContextLost?.());

        if (!ctx || !gl || !maxTextureSize || maxTextureSize <= 0) {
            throw new Error("WebGL context invalid");
        }

        const json = await (await fetch("./wind/wind.json")).json();

        windObject = new Wind(viewer, ctx, {
            dimension: json.dimensions,
            altitudes: json.altitudes,
            boundary: [100,15, 150,15, 150,55, 100,55],
            uvws: {
                u: json.us,
                v: json.vs,
                w: json.ws
            },
            valueMinMax: [json.uMinMax, json.vMinMax, json.wMinMax],
            velocityMinMax: [0, 30],
            textureSize: 256,
            trailLength: 8,
            speedFactor: 0.15,
            colorMode: "windspeed",
            verticalScale: 1.0,
            alpha: 0.85
        });

        viewer.scene.primitives.add(windObject.getPrimitiveCollection());
    }

    function stopAR() {
        arMode = false;
        stopOrientationTracking();
        stopCamera();

        arToggleBtn.className = "ar-toggle off";
        arToggleBtn.textContent = "AR 시작";
        liveBadgeEl.classList.remove("show");

        if (currentLon != null && currentLat != null) {
            moveCameraToCurrentPositionOnly();
        }

        statusEl.textContent = "AR 종료됨";
        showToast("AR 모드 종료");
    }


    headingOffsetEl.addEventListener("input", () => {
        updateOffsetLabels();
        if (arMode) applyCameraPose();
    });

    pitchOffsetEl.addEventListener("input", () => {
        updateOffsetLabels();
        if (arMode) applyCameraPose();
    });

    heightOffsetEl.addEventListener("input", () => {
        updateOffsetLabels();
        if (currentLon != null && currentLat != null) {
            if (arMode) applyCameraPose();
            else moveCameraToCurrentPositionOnly();
        }
    });

    tilesetHeightOffsetEl.addEventListener("input", () => {
        updateOffsetLabels();
        applyTilesetHeightOffset();
    });

    fovRangeEl.addEventListener("input", () => {
        updateOffsetLabels();
        viewer.camera.frustum.fov = Cesium.Math.toRadians(Number(fovRangeEl.value));
        viewer.scene.requestRender();
    });

    document.getElementById("gpsChip").addEventListener("click", async () => {
        if (currentLon == null || currentLat == null) {
            showToast("현재 위치가 아직 없습니다.");
            return;
        }
        await updateGroundHeight(true);
        if (arMode) applyCameraPose();
        else moveCameraToCurrentPositionOnly();
        showToast("현재 위치로 이동");
    });

    let leftPanelOpen = true;

    panelToggleBtn.addEventListener("click", () => {
        leftPanelOpen = !leftPanelOpen;
        leftPanelBody.style.display = leftPanelOpen ? "block" : "none";
        panelToggleBtn.textContent = leftPanelOpen ? "닫기" : "열기";
    });

    arToggleBtn.addEventListener("click", () => {
        if (arMode) stopAR();
        else startAR();
    });

    function dlog(msg, color = "#4ade80") {
        const debugLogEl = document.getElementById("debugLog");
        const t = new Date().toLocaleTimeString("ko-KR", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });
        debugLogEl.innerHTML += `<div style="color:${color}"><span style="color:#666">[${t}]</span> ${msg}</div>`;
        debugLogEl.scrollTop = debugLogEl.scrollHeight;
    }

    window.toggleDebug = function() {
        const p = document.getElementById("debugPanel");
        const open = p.style.display !== "none";
        p.style.display = open ? "none" : "block";
        if (!open) {
            const ua = navigator.userAgent;
            dlog("━━━ 환경 체크 ━━━", "#fbbf24");
            dlog("프로토콜: " + location.protocol + (location.protocol === "https:" ? " ✓" : " ✗"), "#93c5fd");
            dlog("기기: " + (/iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : "Desktop"), "#93c5fd");
            dlog("mediaDevices: " + (navigator.mediaDevices ? "✓" : "✗"));
            dlog("Geolocation: " + (navigator.geolocation ? "✓" : "✗"));
            dlog("AR mode: " + arMode);
            dlog("GPS started: " + gpsStarted);
            dlog("Orientation started: " + orientationStarted);
            dlog("Camera started: " + cameraStarted);
            dlog("Main tileset loaded: " + (!!mainTileset));
            dlog("Extra tilesets loaded: " + extraTilesets.length);
            if (currentLon != null && currentLat != null) {
                dlog(`Current pos: ${currentLat.toFixed(6)}, ${currentLon.toFixed(6)} h=${currentHeight == null ? "n/a" : currentHeight.toFixed(1)} ground=${groundHeight.toFixed(1)}`);
            }
        }
    };

    window.debugTestCamera = async function() {
        dlog("카메라 테스트...", "#93c5fd");
        try {
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            const t = s.getVideoTracks()[0];
            dlog("✓ 성공! " + JSON.stringify(t.getSettings()), "#4ade80");
            s.getTracks().forEach(track => track.stop());
        } catch (e) {
            dlog("✗ " + e.name + ": " + e.message, "#f87171");
        }
    };

    window.debugTestGPS = function() {
        dlog("GPS 테스트...", "#4ade80");
        navigator.geolocation.getCurrentPosition(
            p => dlog(`✓ ${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)} (±${Math.round(p.coords.accuracy)}m)`, "#4ade80"),
            e => dlog("✗ " + e.message, "#f87171"),
            { enableHighAccuracy: true, timeout: 8000 }
        );
    };

    window.debugTestOrientation = async function() {
        dlog("센서 테스트...", "#fbbf24");
        if (typeof DeviceOrientationEvent?.requestPermission === "function") {
            try {
                const r = await DeviceOrientationEvent.requestPermission();
                dlog("iOS 권한: " + r, r === "granted" ? "#4ade80" : "#f87171");
                if (r !== "granted") return;
            } catch (e) {
                dlog("권한 오류: " + e.message, "#f87171");
                return;
            }
        }

        let cnt = 0;
        const h = (e) => {
            cnt++;
            if (cnt === 1 || cnt % 20 === 0) {
                const heading = e.webkitCompassHeading ?? ((360 - (e.alpha || 0)) % 360);
                dlog(`#${cnt} heading=${heading.toFixed(1)} beta=${(e.beta || 0).toFixed(1)} gamma=${(e.gamma || 0).toFixed(1)}`);
            }
        };
        window.addEventListener("deviceorientation", h, true);
        setTimeout(() => {
            window.removeEventListener("deviceorientation", h, true);
            dlog("총 " + cnt + "개 " + (cnt > 0 ? "✓" : "✗"), cnt > 0 ? "#4ade80" : "#f87171");
        }, 5000);
    };

    window.addEventListener("beforeunload", () => {
        stopOrientationTracking();
        stopCamera();
        stopGeolocation();
    });

    updateOffsetLabels();
    updateGPSChip();
    updateSensorText();
    updateCoordText();
    updateTilesetText();
</script>

<style>
    :root {
        --accent: #2d7ef7;
        --danger: #d74c4c;
        --ok: #22c55e;
        --warn: #f59e0b;
        --glass: rgba(0,0,0,0.55);
        --glass-2: rgba(255,255,255,0.08);
        --border: rgba(255,255,255,0.15);
        --text: #fff;
        --muted: rgba(255,255,255,0.75);
    }

    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000;
        font-family: sans-serif;
    }

    #cameraVideo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        z-index: 0;
        display: none;
    }

    #cesiumContainer {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: transparent !important;
    }

    #cesiumContainer canvas {
        background: transparent !important;
    }

    #ui {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
    }

    .panel, .btn, .chip, .toast, .debug-panel {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }

    .top-bar {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        pointer-events: auto;
    }

    .live-badge {
        display: none;
        align-items: center;
        gap: 6px;
        background: rgba(45,126,247,0.9);
        border-radius: 999px;
        padding: 10px 14px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
    }

    .live-badge.show {
        display: inline-flex;
    }

    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #fff;
        animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
        0%,100% { opacity: 1; }
        50% { opacity: 0.35; }
    }

    .left-panel {
        position: absolute;
        left: 12px;
        top: 62px;
        width: 320px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 160px);
        overflow-y: auto;
        pointer-events: auto;
    }

    .panel {
        background: var(--glass);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 10px;
    }

    .panel h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
    }

    .status {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
        line-height: 1.45;
        word-break: break-word;
    }

    .row {
        margin-top: 10px;
    }

    .label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
        font-size: 12px;
        color: var(--muted);
    }

    .btn {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 11px 12px;
        margin-top: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        background: var(--accent);
        color: #fff;
    }

    .btn.secondary {
        background: #555;
    }

    .btn.danger {
        background: var(--danger);
    }

    .btn.success {
        background: var(--ok);
    }

    .btn.small {
        width: auto;
        padding: 8px 10px;
        font-size: 12px;
        margin-top: 0;
    }

    input[type="range"],
    input[type="text"] {
        width: 100%;
        box-sizing: border-box;
    }

    input[type="text"] {
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
    }

    input[type="range"] {
        accent-color: var(--accent);
    }

    .small {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
        line-height: 1.45;
    }

    .hint {
        margin-top: 4px;
        font-size: 11px;
        color: rgba(255,255,255,0.68);
        line-height: 1.4;
    }

    .hstack {
        display: flex;
        gap: 8px;
    }

    .hstack .btn {
        flex: 1;
    }

    .bottom-bar {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        pointer-events: auto;
    }

    .chip {
        background: var(--glass);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
        min-width: 130px;
        font-size: 12px;
        line-height: 1.6;
    }

    .chip-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
    }

    .chip-label {
        color: var(--muted);
    }

    .acc-good { color: #4ade80; }
    .acc-ok   { color: #fbbf24; }
    .acc-bad  { color: #f87171; }

    .ar-toggle {
        border: none;
        border-radius: 999px;
        padding: 14px 18px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 6px 20px rgba(45,126,247,0.35);
        min-width: 180px;
    }

    .ar-toggle.off {
        background: var(--accent);
    }

    .ar-toggle.on {
        background: var(--danger);
        box-shadow: 0 6px 20px rgba(215,76,76,0.35);
    }

    .compass-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }

    .compass {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--glass);
        border: 1px solid var(--border);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .compass-n {
        position: absolute;
        top: 6px;
        font-size: 9px;
        font-weight: 800;
        color: #f87171;
    }

    .needle {
        width: 2px;
        height: 20px;
        position: absolute;
        left: calc(50% - 1px);
        bottom: 50%;
        transform-origin: bottom center;
        border-radius: 2px;
        background: linear-gradient(to top, rgba(255,255,255,0.25) 50%, #f87171 50%);
    }

    .deg {
        font-size: 11px;
        color: var(--muted);
    }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 88px;
        transform: translateX(-50%) translateY(12px);
        background: rgba(10,18,40,0.92);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 11px 16px;
        z-index: 200;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        white-space: nowrap;
    }

    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    #debugTab {
        position: fixed;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        z-index: 300;
        pointer-events: auto;
    }

    #debugTab button {
        background: rgba(251,191,36,0.9);
        border: none;
        color: #000;
        font-size: 10px;
        font-weight: 800;
        padding: 6px 8px;
        border-radius: 6px 0 0 6px;
        cursor: pointer;
        writing-mode: vertical-rl;
        letter-spacing: 1px;
    }

    .debug-panel {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 299;
        background: rgba(0,0,0,0.92);
        color: #4ade80;
        padding: 56px 14px 14px;
        overflow-y: auto;
        pointer-events: auto;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.8;
    }

    .debug-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }

    .debug-head-title {
        color: #fbbf24;
        font-weight: 700;
        font-size: 13px;
    }

    .debug-head button,
    .debug-actions button {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.18);
        color: #fff;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
    }

    .debug-actions {
        margin-top: 14px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    @media (max-width: 768px) {
        .left-panel {
            width: 280px;
            max-width: calc(100vw - 24px);
            max-height: 42vh;
        }

        .bottom-bar {
            align-items: center;
        }

        .ar-toggle {
            min-width: 150px;
        }
    }
</style>
</body>
</html>
